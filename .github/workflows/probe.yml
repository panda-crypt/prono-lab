name: Sonde Understat (temporaire)
on:
  push:
    branches: [probe-us]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Interroger
        run: |
          mkdir -p probe; rm -f probe/*
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          for sl in ligue-1 champions-league; do
            curl -s -m 30 -A "$UA" "https://statz.ai/competitions/$sl/fixtures" -o probe/fx_$sl.html -w "fx $sl %{http_code} %{size_download}\n" >> probe/status.txt
          done
          curl -s -m 30 -A "$UA" "https://statz.ai/competitions/ligue-1/results" -o probe/res_l1.html -w "res %{http_code} %{size_download}\n" >> probe/status.txt
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add probe && git commit -qm "sonde" && git push -q origin HEAD:probe-us
