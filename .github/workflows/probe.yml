name: Sonde ESPN (temporaire)
on:
  push:
    branches: [probe-espn]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Interroger ESPN
        run: |
          mkdir -p probe; rm -f probe/*
          curl -s --compressed -m 60 "https://sports.core.api.espn.com/v2/sports/soccer/leagues?limit=1000" -o probe/core.json -w "core %{http_code} %{size_download}\n" >> probe/status.txt
          python3 - <<'PY' >> probe/status.txt
          import json,re
          d=json.load(open("probe/core.json")); refs=[x["$ref"] for x in d.get("items",[])]
          slugs=[re.search(r"leagues/([^?]+)", r).group(1) for r in refs]
          open("probe/slugs.txt","w").write("\n".join(slugs))
          print(len(slugs))
          PY
          cat probe/status.txt
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add probe && git commit -qm "sonde" && git push -q origin HEAD:probe-espn
