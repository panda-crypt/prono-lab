plugins {
    id 'com.android.application'
}

def ksFile = file(System.getenv("KEYSTORE_PATH") ?: "../release.jks")

android {
    namespace 'fr.pronolab.app'
    compileSdk 34

    defaultConfig {
        applicationId "fr.pronolab.app"
        minSdk 26
        targetSdk 34
        versionCode((System.getenv("VERSION_CODE") ?: "1") as int)
        versionName "2." + (System.getenv("VERSION_CODE") ?: "1")
    }

    signingConfigs {
        release {
            storeFile ksFile
            storePassword System.getenv("KS_PASS") ?: "pronolab"
            keyAlias "pronolab"
            keyPassword System.getenv("KS_PASS") ?: "pronolab"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
