plugins {
    id 'com.android.application'
}

def ksFile = file(System.getenv("KEYSTORE_PATH") ?: "../release.jks")

android {
    namespace 'fr.pronolab.app'
    compileSdk 36

    defaultConfig {
        applicationId "fr.pronolab.app"
        minSdk 26
        targetSdk 36
        versionCode((System.getenv("VERSION_CODE") ?: "1") as int)
        versionName "2." + (System.getenv("VERSION_CODE") ?: "1")
    }

    signingConfigs {
        release {
            storeFile ksFile
            storePassword System.getenv("KS_PASS") ?: "pronolab"
            keyAlias "pronolab"
            keyPassword System.getenv("KS_PASS") ?: "pronolab"
        }
        // Version publique (Google Play) : clé d'envoi gardée dans les secrets GitHub ; à défaut, la clé de l'application perso
        upload {
            def up = System.getenv("UPLOAD_KS_PATH")
            storeFile up ? file(up) : ksFile
            storePassword up ? System.getenv("UPLOAD_KS_PASS") : (System.getenv("KS_PASS") ?: "pronolab")
            keyAlias up ? "upload" : "pronolab"
            keyPassword up ? System.getenv("UPLOAD_KS_PASS") : (System.getenv("KS_PASS") ?: "pronolab")
        }
    }

    buildFeatures { buildConfig true }

    flavorDimensions = ["edition"]
    productFlavors {
        // Application personnelle : complète (Metabet, clé de cotes, ouverture des bookmakers)
        perso {
            dimension "edition"
            applicationId "fr.pronolab.app"
            resValue "string", "app_name", "Prono Lab"
            buildConfigField "boolean", "PUB", "false"
            signingConfig signingConfigs.release
        }
        // Version publique, destinée à Google Play
        pub {
            dimension "edition"
            applicationId "fr.pronolab.analyse"
            resValue "string", "app_name", "Prono Lab"
            buildConfigField "boolean", "PUB", "true"
            signingConfig signingConfigs.upload
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
}
